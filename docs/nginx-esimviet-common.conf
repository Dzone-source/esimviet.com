# Shared HTTPS settings for esimviet.com + 5gtrip.com (include inside each server block)

include /etc/nginx/snippets/cloudflare-realip.conf;

# $is_cloudflare_edge defined in /etc/nginx/conf.d/cloudflare-geo.conf
if ($is_cloudflare_edge = 0) {
    return 403;
}

if ($host ~* "^\d+\.\d+\.\d+\.\d+$") {
    return 444;
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

client_max_body_size 10M;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
}

location /api {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Access-Token $http_x_access_token;
    proxy_set_header Cookie $http_cookie;
}

location /uploads {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, no-transform";
}

location /health {
    proxy_pass http://127.0.0.1:4000;
    access_log off;
}

location /_next/static {
    proxy_pass http://127.0.0.1:3000;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
