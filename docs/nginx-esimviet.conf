# Nginx site config for esimviet.com + 5gtrip.com (Cloudflare-only access)
#
# Install:
#   sudo cp docs/nginx-cloudflare-allow.conf /etc/nginx/snippets/cloudflare-allow.conf
#   sudo cp docs/nginx-cloudflare-realip.conf /etc/nginx/snippets/cloudflare-realip.conf
#   sudo cp docs/nginx-cloudflare-geo.conf /etc/nginx/conf.d/cloudflare-geo.conf
#   sudo cp docs/nginx-esimviet-common.conf /etc/nginx/snippets/esimviet-common.conf
#   sudo cp docs/nginx-esimviet.conf /etc/nginx/sites-available/esimviet.com
#   sudo ln -sf /etc/nginx/sites-available/esimviet.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (DNS challenge via Cloudflare):
#   sudo bash scripts/setup-certbot-dns-cloudflare.sh          # esimviet.com
#   sudo bash scripts/setup-certbot-5gtrip.sh                  # 5gtrip.com
#
# Also run:
#   sudo bash scripts/setup-nginx-reject-cert.sh
#   sudo bash scripts/setup-cloudflare-firewall.sh

# Drop direct IP / unknown host requests (HTTP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Drop direct IP / unknown host requests (HTTPS)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/default-reject.crt;
    ssl_certificate_key /etc/nginx/ssl/default-reject.key;

    return 444;
}

# HTTP → HTTPS redirect (all domains)
server {
    listen 80;
    listen [::]:80;
    server_name esimviet.com www.esimviet.com 5gtrip.com www.5gtrip.com;

    include /etc/nginx/snippets/cloudflare-allow.conf;

    return 301 https://$host$request_uri;
}

# HTTPS — esimviet.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esimviet.com www.esimviet.com;

    ssl_certificate /etc/letsencrypt/live/esimviet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esimviet.com/privkey.pem;

    include /etc/nginx/snippets/esimviet-common.conf;
}

# HTTPS — 5gtrip.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 5gtrip.com www.5gtrip.com;

    ssl_certificate /etc/letsencrypt/live/5gtrip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5gtrip.com/privkey.pem;

    include /etc/nginx/snippets/esimviet-common.conf;
}
