# Nginx site config for esimviet.com (Cloudflare-only access)
#
# Install:
#   sudo cp docs/nginx-cloudflare-allow.conf /etc/nginx/snippets/cloudflare-allow.conf
#   sudo cp docs/nginx-cloudflare-realip.conf /etc/nginx/snippets/cloudflare-realip.conf
#   sudo cp docs/nginx-cloudflare-geo.conf /etc/nginx/conf.d/cloudflare-geo.conf
#   sudo cp docs/nginx-esimviet.conf /etc/nginx/sites-available/esimviet.com
#   sudo ln -sf /etc/nginx/sites-available/esimviet.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Also run:
#   sudo bash scripts/setup-nginx-reject-cert.sh
#   sudo bash scripts/setup-cloudflare-firewall.sh
#
# SSL: use Cloudflare Origin Certificate on the server, or certbot DNS challenge.
# HTTP-01 certbot renewal will NOT work once UFW blocks non-Cloudflare IPs.

# Drop direct IP / unknown host requests (HTTP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Drop direct IP / unknown host requests (HTTPS)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/default-reject.crt;
    ssl_certificate_key /etc/nginx/ssl/default-reject.key;

    return 444;
}

# HTTP → HTTPS redirect (domain only)
server {
    listen 80;
    listen [::]:80;
    server_name esimviet.com www.esimviet.com;

    include /etc/nginx/snippets/cloudflare-allow.conf;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esimviet.com www.esimviet.com;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # $is_cloudflare_edge defined in /etc/nginx/conf.d/cloudflare-geo.conf
    if ($is_cloudflare_edge = 0) {
        return 403;
    }

    # Block requests that use a raw IP in the Host header
    if ($host ~* "^\d+\.\d+\.\d+\.\d+$") {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/esimviet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esimviet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_set_header Cookie $http_cookie;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
