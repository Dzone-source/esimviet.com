# Dùng MariaDB đã cài sẵn trên aaPanel (KHÔNG chạy container MariaDB)
#
# Cách dùng:
#   1. Tạo database trong aaPanel → Database → Add database
#   2. Sửa .env: DB_HOST=host.docker.internal
#   3. docker compose -f docker-compose.aapanel-db.yml up -d --build
#
# Xem thêm: docs/docker-aapanel.md → mục "Dùng MariaDB của aaPanel"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esim-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DATABASE_URL: mysql://${MYSQL_USER:-esim_user}:${MYSQL_PASSWORD}@${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${MYSQL_DATABASE:-esim_db}
      SEED_DATABASE: ${SEED_DATABASE:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-eSIM Global}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_DIR: ./uploads
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - esim-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-eSIM Global}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_FB_MESSENGER: ${NEXT_PUBLIC_FB_MESSENGER:-}
    container_name: esim-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - esim-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: esim-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - esim-network

networks:
  esim-network:
    driver: bridge

volumes:
  backend_uploads:
  backend_logs:
